name: Build EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Для импорта scapy на раннере Npcap не нужен: без него scapy на
      # Windows просто пишет предупреждение в stderr и отключает захват
      # пакетов (conf.use_pcap = False) — импорт не падает.
      - name: Проверить импорт модулей
        run: |
          python -c "import netid, topology, risk, netscan; print('modules OK')"

      # Встраиваем установщик Npcap прямо в exe (topology.install_npcap()
      # запускает его с UAC при первом включении «Пассивной топологии»,
      # пользователю не нужно отдельно идти на npcap.com). Шаг
      # необязательный: timeout+continue-on-error, чтобы недоступность
      # npcap.com с раннера (бывает) не вешала и не валила сборку — тогда
      # просто соберётся exe без встроенного инсталлятора, а функция сама
      # предложит ссылку на ручную установку.
      - name: Скачать установщик Npcap (для встраивания в exe)
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          try {
            Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.79.exe" `
              -OutFile "assets\npcap-installer.exe" -TimeoutSec 90
            Write-Host "Npcap installer: скачан."
          } catch {
            Write-Warning "Не удалось скачать установщик Npcap — соберём exe без него: $_"
            Remove-Item "assets\npcap-installer.exe" -ErrorAction SilentlyContinue
          }

      - name: Собрать NetSuite.exe (GUI)
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path "assets\npcap-installer.exe") {
            $extra = @("--add-data", "assets\npcap-installer.exe;assets")
          }
          pyinstaller --onefile --windowed --name NetSuite --icon assets\netsuite.ico `
            --add-data "assets\netsuite.ico;assets" --add-data "assets\netsuite.png;assets" `
            @extra netsuite.py

      - name: Собрать NetScan.exe (консоль)
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path "assets\npcap-installer.exe") {
            $extra = @("--add-data", "assets\npcap-installer.exe;assets")
          }
          pyinstaller --onefile --console --name NetScan --icon assets\netsuite.ico @extra netscan.py

      - name: Сохранить артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist\NetSuite.exe
            dist\NetScan.exe

      - name: Создать GitHub Release (по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetSuite.exe
            dist/NetScan.exe

name: Build EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Npcap на раннере не ставим: scapy без него на Windows при импорте
      # просто пишет предупреждение в stderr ("No libpcap provider available")
      # и отключает захват пакетов (conf.use_pcap = False) — импорт и сборка
      # от этого не падают. Сам .exe Npcap всё равно не включает — это
      # системный драйвер, который конечный пользователь ставит отдельно на
      # своей машине, если ему нужна пассивная топология (LLDP/CDP,
      # topology.build_passive_topology); остальной функционал работает без него.
      - name: Проверить импорт модулей
        run: |
          python -c "import netid, topology, risk, netscan; print('modules OK')"

      - name: Собрать NetSuite.exe (GUI)
        run: |
          pyinstaller --onefile --windowed --name NetSuite --icon assets\netsuite.ico --add-data "assets\netsuite.ico;assets" --add-data "assets\netsuite.png;assets" netsuite.py

      - name: Собрать NetScan.exe (консоль)
        run: |
          pyinstaller --onefile --console --name NetScan --icon assets\netsuite.ico netscan.py

      - name: Сохранить артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist\NetSuite.exe
            dist\NetScan.exe

      - name: Создать GitHub Release (по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetSuite.exe
            dist/NetScan.exe
